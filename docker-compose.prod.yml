services:
  postgres:
    image: postgres:17-alpine
    container_name: siakad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-siakad}
      POSTGRES_USER: ${DB_USERNAME:-siakad}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - siakad-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-siakad}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - siakad-net
    # No host port mapping: the server already runs Postgres for PMB and
    # Sendago on 5432/5433. Only reachable inside siakad-net.

  laravel:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: siakad-laravel
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - siakad-storage:/var/www/storage/app
      # Shared read-only with nginx so it serves index.php and static assets
      # from this same build. Docker seeds the named volume from the image on
      # first mount - which also means a rebuild does NOT refresh it. New
      # public/ assets have to be `docker cp`-ed in, the same trap PMB has.
      - siakad-laravel-public:/var/www/public
    networks:
      - siakad-net

  # The handoff job and its invitation email must not run inside a web request:
  # PMB's HTTP client would time out waiting and redeliver the whole event.
  # PMB has no worker of its own, which is why its own webhook work is inline;
  # this app is built with one from the start.
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: siakad-queue
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - siakad-storage:/var/www/storage/app
    networks:
      - siakad-net
    # --tries=1: each job class sets its own retry policy, and a worker-level
    # override would silently replace it.
    entrypoint: ["php", "artisan", "queue:work", "--tries=1", "--timeout=120", "--sleep=3"]

  # Fase 2 lives or dies on this: SPP is generated by a scheduled command, and
  # nothing runs Laravel's scheduler unless a container does. Sleeps until the
  # next due minute, so no host crontab is involved.
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: siakad-scheduler
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - siakad-storage:/var/www/storage/app
    networks:
      - siakad-net
    entrypoint: ["php", "artisan", "schedule:work"]

  nextjs:
    build:
      context: .
      dockerfile: docker/nextjs/Dockerfile
    container_name: siakad-nextjs
    restart: unless-stopped
    networks:
      - siakad-net

  nginx:
    image: nginx:1.27-alpine
    container_name: siakad-nginx
    restart: unless-stopped
    depends_on:
      - laravel
      - nextjs
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - siakad-laravel-public:/var/www/public:ro
    ports:
      # 8091, one past PMB's 8090. Port 80 on this box belongs to the Moodle
      # HAProxy frontend, so the Cloudflare Tunnel for sekolah.yapinet.id points
      # here directly, exactly as PMB's does at 8090.
      - "127.0.0.1:8091:80"
    networks:
      - siakad-net

networks:
  siakad-net:
    driver: bridge

volumes:
  siakad-postgres-data:
  siakad-storage:
  siakad-laravel-public:
