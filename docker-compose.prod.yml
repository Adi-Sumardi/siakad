services:
  # Not started on the new distributed topology - app connects to the shared
  # Patroni cluster instead (DB_HOST=10.20.30.1, DB_PORT=5000 via the LB, see
  # infra/README.md "Kenapa app connect DB lewat LB"). Left defined, same as
  # PMB's own compose file, only for local/dev convenience - never brought up
  # in production.
  postgres:
    image: postgres:17-alpine
    container_name: siakad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-siakad}
      POSTGRES_USER: ${DB_USERNAME:-siakad}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - siakad-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-siakad}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - siakad-net

  laravel:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: siakad-laravel
    restart: unless-stopped
    env_file: .env
    volumes:
      # Bind mount, not a named volume - a named volume is local to whichever
      # node's Docker daemon owns it, so a document uploaded through one app
      # node (whichever one HAProxy picked for that request) would only ever
      # be physically present there, same split-brain bug PMB hit in
      # production (infra/memory.md, 2026-09-18). /data/siakad-storage/app is
      # a real local directory on siakad-app-1 (the NFS server) and an NFS
      # mount of that same directory on siakad-app-2 (the client, over wg0
      # only) - both nodes read/write the exact same files from day one here,
      # rather than hitting the bug first and migrating later.
      - /data/siakad-storage/app:/var/www/storage/app
      - siakad-logs:/var/www/storage/logs
      - siakad-laravel-public:/var/www/public
    networks:
      - siakad-net

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: siakad-queue
    restart: unless-stopped
    env_file: .env
    volumes:
      - /data/siakad-storage/app:/var/www/storage/app
      - siakad-logs:/var/www/storage/logs
    networks:
      - siakad-net
    user: "www-data"
    # --tries=1: each job class sets its own retry policy, and a worker-level
    # override would silently replace it.
    entrypoint: ["php", "artisan", "queue:work", "--tries=1", "--timeout=120", "--sleep=3"]

  # Runs on siakad-app-1 only (infra/README.md "Scheduler harus satu
  # instance, bukan dua") - two schedule:work processes would run every
  # Schedule::command() twice per interval, including the one that times out
  # abandoned payments.
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: siakad-scheduler
    restart: unless-stopped
    env_file: .env
    volumes:
      - /data/siakad-storage/app:/var/www/storage/app
      - siakad-logs:/var/www/storage/logs
    networks:
      - siakad-net
    user: "www-data"
    entrypoint: ["php", "artisan", "schedule:work"]

  nextjs:
    build:
      context: .
      dockerfile: docker/nextjs/Dockerfile
    container_name: siakad-nextjs
    restart: unless-stopped
    networks:
      - siakad-net

  nginx:
    image: nginx:1.27-alpine
    container_name: siakad-nginx
    restart: unless-stopped
    depends_on:
      - laravel
      - nextjs
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - siakad-laravel-public:/var/www/public:ro
    ports:
      # HAProxy on `lb` (infra/haproxy/haproxy.cfg, siakad_app_pool) proxies
      # to this node's own wg0 IP on port 80 - same "80:80" bind PMB's own
      # nginx uses (ufw, default deny incoming with only wg0 allowed, is what
      # actually keeps this unreachable from the public internet, not the
      # bind address - see infra/firewall/ufw-app.sh). The old
      # 127.0.0.1:8091 mapping was specific to the single old server sharing
      # port 80 with that box's Moodle HAProxy; the dedicated app nodes here
      # own port 80 outright.
      - "80:80"
    networks:
      - siakad-net

networks:
  siakad-net:
    driver: bridge

volumes:
  siakad-postgres-data:
  # siakad-storage (named volume) removed - storage/app is now a bind mount
  # to /data/siakad-storage/app (see the laravel service's own comment).
  siakad-logs:
  siakad-laravel-public:
