# Konfigurasi Reverse Proxy Nginx Host untuk SIAKAD YAPI
# Domain: siakad.yapinet.id
# Target: Docker Nginx SIAKAD pada 127.0.0.1:8091

server {
    listen 80;
    listen [::]:80;
    server_name siakad.yapinet.id;

    # Let's Encrypt / Certbot ACME challenge validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Logging terpisah agar tidak bercampur dengan Odoo
    access_log /var/log/nginx/siakad-access.log;
    error_log /var/log/nginx/siakad-error.log;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;

        # WebSocket & connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy forwarding headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeout settings
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
