server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    # Laravel's surface; everything else falls through to Next.js below.
    #
    # Flat (non-nested) location on purpose. Nesting `location ~ \.php$` inside
    # this regex location does not reliably re-match the internally-rewritten
    # URI, and every request under these prefixes silently falls through to the
    # catch-all - PMB hit exactly that, and its health check came back as the
    # frontend's login page. `rewrite ... break` with an explicit
    # SCRIPT_FILENAME avoids the re-match entirely.
    location ~ ^/(api|storage|sanctum|up) {
        root /var/www/public;
        rewrite ^ /index.php break;
        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        include fastcgi_params;
    }

    # Everything else - the Next.js app.
    location / {
        proxy_pass http://nextjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
