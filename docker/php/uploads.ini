; PHP's own defaults (upload_max_filesize=2M, post_max_size=8M) cap every
; upload below what the app's validation rules now allow - raised here so
; the Laravel-level checks are actually the limit that applies, not PHP's.
; Same gap PMB found and fixed 2026-09-18 (see that app's own
; docker/php/uploads.ini) - confirmed present here too, never applied.
;
; post_max_size has to cover the WHOLE multipart request, not one file plus
; a little margin - the worst case here is Guru\AchievementController /
; Wali\AchievementController accepting TWO files in the same request
; (sertifikat + foto_kegiatan, each individually allowed up to 5MB by
; Laravel's own `max:5120` rule), so a fully compliant submission can
; legitimately total close to 10MB. Without this, PHP silently empties
; $_POST/$_FILES before Laravel's validator ever runs, and the family sees
; a generic failure with no specific per-file error. 15M leaves headroom
; above the 10MB worst case for multipart boundary overhead and the
; request's other (non-file) fields.
upload_max_filesize = 6M
post_max_size = 15M
